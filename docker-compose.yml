services:
  web:
    container_name: marks-manager-web
    build:
      context: .
      dockerfile: Dockerfile
    command: >
      uvicorn src.app.main:app
      --host 0.0.0.0
      --port ${WEB_PORT:-8001}
      --proxy-headers
      --forwarded-allow-ips="*"
      --reload
      --reload-dir /app/src
      --reload-dir /app/src/templates
      --log-level info
      --access-log
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8001}:8001"
    networks:
      - infra_bigdata-net
    env_file:
      - .env
    environment:
      - PYTHONUNBUFFERED=1
      - LOG_FILTER_HEALTHCHECK=true
      - FORWARDED_ALLOW_IPS=*
      - DB_USER=${POSTGRES_USER}
      - DB_PASSWORD=${POSTGRES_PASSWORD}
      - DB_HOST=${DB_HOST}
      - DB_PORT=${DB_PORT}
      - DB_NAME=${POSTGRES_DB}
    volumes:
      - ./:/app:Z

  auth:
    image: supabase/gotrue:v2.158.0
    container_name: supabase_auth
    restart: unless-stopped
    ports:
      - "${AUTH_PORT:-9999}:9999"
    networks:
      - infra_bigdata-net
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: https://auth.michaelslabs.com
      GOTRUE_SITE_URL: https://marks.michaelslabs.com
      GOTRUE_URI_ALLOW_LIST: https://marks.michaelslabs.com,https://marks.michaelslabs.com/*
      GOTRUE_CORS_ALLOWED_ORIGINS: "*"
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://${POSTGRES_USER}:${GOTRUE_DB_PASSWORD}@${DB_HOST}:${DB_PORT}/${POSTGRES_DB}?sslmode=disable
      GOTRUE_JWT_SECRET: ${SUPABASE_JWT_SECRET}
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_DISABLE_SIGNUP: "false"
      GOTRUE_MAILER_AUTOCONFIRM: "true"

networks:
  infra_bigdata-net:
    external: true