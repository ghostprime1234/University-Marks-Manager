{% extends 'base.html' %}
{% block title %}Login | Marks Manager{% endblock %}
{% block course_header %}{% endblock %}
{% block content %}
<div class="flex items-center justify-center py-12">
  <div class="w-full max-w-md bg-base-100 rounded-xl shadow-md p-8 flex flex-col gap-4">
    <div class="text-center">
      <h2 class="text-2xl font-bold">Sign In</h2>
      <p class="text-xs opacity-60 mt-1">Secured by Supabase Auth</p>
    </div>

    <div id="auth-alert" class="alert alert-error hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2m7-2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      <span id="auth-error-msg"></span>
    </div>

    <div id="auth-success" class="alert alert-success hidden">
      <svg xmlns="http://www.w3.org/2000/svg" class="stroke-current shrink-0 h-5 w-5" fill="none" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z" /></svg>
      <span id="auth-success-msg"></span>
    </div>

    {% if error %}
    <div class="alert alert-error">
      <span>{{ error }}</span>
    </div>
    {% endif %}

    <form id="supabase-login-form" class="flex flex-col gap-4">
      <div class="form-control">
        <label class="label" for="login-email">
          <span class="label-text">Email Address</span>
        </label>
        <input type="email" id="login-email" name="email" required autocomplete="email"
          placeholder="user@example.com"
          class="input input-bordered w-full" />
      </div>

      <div class="form-control">
        <label class="label" for="login-password">
          <span class="label-text">Password</span>
        </label>
        <input type="password" id="login-password" name="password" required autocomplete="current-password"
          placeholder="••••••••"
          class="input input-bordered w-full" />
      </div>

      <div class="flex justify-between items-center text-xs">
        <button type="button" id="forgot-password-btn" class="link link-hover opacity-70">Forgot password?</button>
      </div>

      <button type="submit" id="login-submit-btn" class="btn btn-primary w-full">
        <span id="login-btn-text">Sign In</span>
        <span id="login-btn-spinner" class="loading loading-spinner loading-sm hidden"></span>
      </button>
    </form>

    <div class="divider text-xs opacity-50">OR</div>

    <p class="text-center text-sm">
      Don't have an account?
      <a href="/signup" class="link link-primary font-semibold">Sign up with Supabase</a>
    </p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
  (function() {
    const supabaseUrl = "{{ supabase_url }}";
    const supabaseAnonKey = "{{ supabase_anon_key }}";
    const form = document.getElementById("supabase-login-form");
    const errorAlert = document.getElementById("auth-alert");
    const errorMsg = document.getElementById("auth-error-msg");
    const successAlert = document.getElementById("auth-success");
    const successMsg = document.getElementById("auth-success-msg");
    const submitBtn = document.getElementById("login-submit-btn");
    const btnText = document.getElementById("login-btn-text");
    const btnSpinner = document.getElementById("login-btn-spinner");
    const forgotBtn = document.getElementById("forgot-password-btn");

    function showError(msg) {
      errorMsg.textContent = msg;
      errorAlert.classList.remove("hidden");
      successAlert.classList.add("hidden");
    }

    function showSuccess(msg) {
      successMsg.textContent = msg;
      successAlert.classList.remove("hidden");
      errorAlert.classList.add("hidden");
    }

    function setLoading(isLoading) {
      submitBtn.disabled = isLoading;
      if (isLoading) {
        btnText.classList.add("hidden");
        btnSpinner.classList.remove("hidden");
      } else {
        btnText.classList.remove("hidden");
        btnSpinner.classList.add("hidden");
      }
    }

    const client = (supabaseUrl && supabaseAnonKey) 
      ? supabase.createClient(supabaseUrl, supabaseAnonKey) 
      : null;

    form.addEventListener("submit", async function(e) {
      e.preventDefault();
      errorAlert.classList.add("hidden");
      successAlert.classList.add("hidden");

      const email = document.getElementById("login-email").value.trim();
      const password = document.getElementById("login-password").value;

      if (!client) {
        showError("Supabase environment configuration (SUPABASE_URL and SUPABASE_ANON_KEY) is missing.");
        return;
      }

      setLoading(true);
      try {
        const { data, error } = await client.auth.signInWithPassword({ email, password });
        if (error) {
          showError(error.message);
          setLoading(false);
          return;
        }

        if (data && data.session) {
          const accessToken = data.session.access_token;
          const refreshToken = data.session.refresh_token;

          // Set client cookie for immediate browser request identification
          document.cookie = "sb_access_token=" + encodeURIComponent(accessToken) + "; path=/; max-age=604800; SameSite=Lax";

          // Sync server-side session
          const resp = await fetch("/auth/session", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              "Authorization": "Bearer " + accessToken
            },
            body: JSON.stringify({
              access_token: accessToken,
              refresh_token: refreshToken
            })
          });

          if (!resp.ok) {
            const errBody = await resp.json().catch(() => ({}));
            showError(errBody.detail || "Failed to initialize server session");
            setLoading(false);
            return;
          }

          window.location.href = "/?selected=1";
        } else {
          showError("Unable to retrieve Supabase session. Please check your credentials.");
          setLoading(false);
        }
      } catch (err) {
        showError(err.message || "An unexpected error occurred during sign-in.");
        setLoading(false);
      }
    });

    forgotBtn?.addEventListener("click", async function() {
      const email = document.getElementById("login-email").value.trim();
      if (!email) {
        showError("Please enter your email address to receive a password reset link.");
        return;
      }
      if (!client) {
        showError("Supabase client not configured.");
        return;
      }
      try {
        const { error } = await client.auth.resetPasswordForEmail(email);
        if (error) {
          showError(error.message);
        } else {
          showSuccess("Password reset instructions sent to your email.");
        }
      } catch (err) {
        showError(err.message || "Failed to send reset email.");
      }
    });
  })();
</script>
{% endblock %}
